# PostgreSQL en la instancia AWS EC2.
# Reemplazar la IP por la de su propia instancia (o definir DB_URL / DB_USER / DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://IP_DE_SU_EC2:5432/tienda_gamer}
spring.datasource.username=${DB_USER:tienda_user}
spring.datasource.password=${DB_PASSWORD:cambiar_clave}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
