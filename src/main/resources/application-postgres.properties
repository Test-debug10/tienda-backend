# ==========================================================
# PostgreSQL en la instancia AWS EC2 (Learner Lab)
#   Instancia: tienda-gamer-db (Ubuntu, t3.micro), IP elástica 52.5.171.74
#   Base: tienda_gamer · Usuario: tienda_user
#
# La contraseña NO va en el repositorio: se lee de la variable de entorno
# TIENDA_DB_PASSWORD (o DB_PASSWORD). En la instancia está en /root/clave-db.txt
#
# Levantar con:  .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# Si la instancia cambia, se puede sobrescribir todo con DB_URL / DB_USER / DB_PASSWORD.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://52.5.171.74:5432/tienda_gamer}
spring.datasource.username=${DB_USER:tienda_user}
spring.datasource.password=${DB_PASSWORD:${TIENDA_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
