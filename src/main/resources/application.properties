spring.application.name=tienda-backend
server.port=8080

# ==========================================================
# Base de datos por defecto: H2 en archivo (no requiere instalar nada).
# Para usar PostgreSQL en EC2:  -Dspring.profiles.active=postgres
# Para usar MySQL:              -Dspring.profiles.active=mysql
# ==========================================================
spring.datasource.url=jdbc:h2:file:./data/tiendadb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================================
# JWT
# La clave se lee de la variable de entorno JWT_SECRET (Base64, minimo 256 bits).
# El valor por defecto es solo para desarrollo local.
# ==========================================================
app.jwt.secret=${JWT_SECRET:dGllbmRhLWdhbWVyLWR1b2MtZHN5MTEwNC1jbGF2ZS1zb2xvLXBhcmEtZGVzYXJyb2xsby0yMDI2}
# Token de acceso: 30 minutos. Token de renovacion: 7 dias.
app.jwt.expiration-ms=1800000
app.jwt.refresh-expiration-ms=604800000

# Origenes permitidos para CORS (frontend Vite)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
